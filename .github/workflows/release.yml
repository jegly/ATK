# Builds the .deb, attests it, and publishes a GitHub release, all in one run.
# Run it from the Actions tab (Release > Run workflow). Nothing is published
# unless every step passes (Go tests included). Afterwards the new version and
# checksum are committed to main (nfpm.yaml and README.md).
#
# Built inside the latest Ubuntu (ubuntu:latest). The .deb's library
# minimums come from dpkg-shlibdeps (.github/ci/deb-depends.sh), so they
# track the newest release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version like 1.2.3. Leave empty to bump the patch of the latest version."
        required: false
        default: ""
      notes:
        description: "Optional text shown above the generated release notes."
        required: false
        default: ""

permissions:
  contents: write     # tag, release, version/README commit
  id-token: write     # build attestation
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DEB_GLOB: build/atk_*_amd64.deb
  # Any versioned .deb filename in README.md, rewritten to the new one.
  DEB_NAME_REGEX: 'atk_[0-9][0-9.]*_amd64\.deb'

jobs:
  release:
    name: Build, attest and publish .deb
    runs-on: ubuntu-latest
    container: ubuntu:latest
    defaults:
      run:
        # Container jobs default to sh; the steps use bash.
        shell: bash
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_NOTES: ${{ inputs.notes }}
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gh python3 build-essential pkg-config dpkg-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed to work out the version

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Wails CLI at the version go.mod uses; nfpm and pnpm at their latest.
      - name: Install Wails, nfpm and pnpm
        run: |
          wails_ver=$(grep -oP 'github.com/wailsapp/wails/v2 \Kv[0-9.]+' go.mod)
          go install "github.com/wailsapp/wails/v2/cmd/wails@$wails_ver"
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          npm install -g pnpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Work out version
        id: ver
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          # Latest of: the latest published release, and the version in
          # nfpm.yaml. Not the highest tag: repos can have stray old tags.
          last_raw=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          last_tag=$(echo "$last_raw" | sed 's/^v//' | grep -E "$semver" || true)
          file_ver=$(grep -m1 -oP '^version: "\K[0-9]+\.[0-9]+\.[0-9]+(?=")' nfpm.yaml || true)
          latest=$(printf '%s\n' $last_tag $file_ver | sort -V | tail -n1)

          version="${INPUT_VERSION#v}"
          if [[ -z "$version" ]]; then
            if [[ -z "$latest" ]]; then
              echo "::error::No previous version found. Enter one, e.g. 1.0.0."; exit 1
            fi
            IFS=. read -r ma mi pa <<< "$latest"
            version="$ma.$mi.$((pa + 1))"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$version')."; exit 1
          fi
          if [[ -n "$latest" ]] && { [[ "$version" == "$latest" ]] || [[ "$(printf '%s\n' "$latest" "$version" | sort -V | tail -n1)" != "$version" ]]; }; then
            echo "::error::$version is not higher than the latest version $latest."; exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::A release or draft named v$version already exists."; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists."; exit 1
          fi

          {
            echo "version=$version"
            echo "last_tag=${last_tag:+$last_raw}" # real tag name
          } >> "$GITHUB_OUTPUT"
          echo "Releasing **v$version**. Previous release: ${last_raw:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build .deb
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # The package version comes from nfpm.yaml.
          sed -i "s/^version: \"[^\"]*\"/version: \"$VERSION\"/" nfpm.yaml
          grep -q "^version: \"$VERSION\"" nfpm.yaml
          wails build -tags webkit2_41
          go test -tags webkit2_41 ./...
          .github/ci/deb-depends.sh
          nfpm pkg --packager deb --config nfpm.ci.yaml --target build/

      - name: Checksum
        id: sum
        run: |
          shopt -s nullglob
          debs=($DEB_GLOB)
          [[ ${#debs[@]} -eq 1 ]] || { echo "::error::Expected one .deb, found: ${debs[*]}"; exit 1; }
          (cd "$(dirname "${debs[0]}")" && sha256sum "$(basename "${debs[0]}")") > SHA256SUMS
          cat SHA256SUMS
          echo "path=${debs[0]}" >> "$GITHUB_OUTPUT"
          echo "deb=$(basename "${debs[0]}")" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.sum.outputs.path }}

      - name: Publish release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          LAST_TAG: ${{ steps.ver.outputs.last_tag }}
          DEB: ${{ steps.sum.outputs.deb }}
          DEB_PATH: ${{ steps.sum.outputs.path }}
          SHA: ${{ steps.sum.outputs.sha }}
        run: |
          args=(-f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA")
          [[ -n "$LAST_TAG" ]] && args+=(-f previous_tag_name="$LAST_TAG")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > generated.md
          {
            [[ -n "$INPUT_NOTES" ]] && printf '%s\n\n' "$INPUT_NOTES"
            cat generated.md
            printf '\n## Verify\n\n| File | SHA-256 |\n|---|---|\n| `%s` | `%s` |\n\n' "$DEB" "$SHA"
            printf '```bash\nsha256sum %s\n```\n\n' "$DEB"
            printf 'Build provenance: the [attestation](https://github.com/%s/attestations) shows the package was built by this repository'"'"'s release workflow from tag `v%s`. With the GitHub CLI: `gh attestation verify %s --repo %s`.\n' "$GITHUB_REPOSITORY" "$VERSION" "$DEB" "$GITHUB_REPOSITORY"
          } > notes.md

          # Tag first, then a draft with the files, then publish: an immutable
          # release is complete the moment it goes public.
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"
          if ! gh release create "v$VERSION" "$DEB_PATH" SHA256SUMS --draft --verify-tag \
              --title "v$VERSION" --notes-file notes.md; then
            git push --delete origin "refs/tags/v$VERSION"
            exit 1
          fi
          gh release edit "v$VERSION" --draft=false --latest
          echo "Published v$VERSION: $DEB ($SHA)" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit version and checksum to main
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DEB: ${{ steps.sum.outputs.deb }}
          SHA: ${{ steps.sum.outputs.sha }}
        run: |
          python3 - <<'EOF'
          import os, re
          deb, sha, repo = os.environ["DEB"], os.environ["SHA"], os.environ["GITHUB_REPOSITORY"]
          p = "README.md"
          s = open(p).read()
          s = re.sub(os.environ["DEB_NAME_REGEX"], deb, s)
          start, end = "<!-- release-checksums:start -->", "<!-- release-checksums:end -->"
          block = (f"{start}\n| File | SHA-256 |\n|---|---|\n| `{deb}` | *sha256:{sha}* |\n\n"
                   f"Verify a download:\n\n```bash\nsha256sum {deb}\n```\n\n"
                   f"The [build attestation](https://github.com/{repo}/attestations) shows it was built by this "
                   "repository's release workflow (with the GitHub CLI: "
                   f"`gh attestation verify {deb} --repo {repo}`).\n{end}")
          if start in s and end in s:
              s = s[:s.index(start)] + block + s[s.index(end) + len(end):]
          else:
              print("::warning::README has no release-checksums markers; checksum block not updated.")
          open(p, "w").write(s)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md nfpm.yaml
          git commit -m "Release v$VERSION: version and checksum" -m "$DEB sha256 $SHA"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::warning::Could not push the version/README update to main; the release itself is published." | tee -a "$GITHUB_STEP_SUMMARY"
